<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/QW_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmartQEye Coastal — AI-based Coastal Drone Surveillance & Intelligence Platform for Kerala Police" />
    <title>SmartQEye Coastal — Quantumweave Intelligence</title>
    <script>
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('sqeye-theme') || '{}');
          var mode = stored?.state?.mode || 'light';
          var resolved = stored?.state?.resolved || (mode === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode);
          if (resolved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
