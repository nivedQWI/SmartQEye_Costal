# ============================================================
# SmartQEye Coastal — Production Hardened Nginx Configuration
# Security-hardened, non-root, air-gapped ready
# ============================================================

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp directories in /tmp for non-root unprivileged execution
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Hardened Security Headers per Kerala Cyber Division & CERT-In guidelines
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob: data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Healthcheck endpoint (Docker HEALTHCHECK, Kubernetes liveness/readiness probes)
        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Runtime configuration (never cached so container env injection takes immediate effect)
        location = /config.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files $uri =404;
        }

        # Hashed static assets (immutable caching for maximum performance)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public demo media
        location /demo/ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Coastal drone video feeds
        location /videos/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Accept-Ranges bytes;
        }

        # SPA fallback routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
