services:
  context-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartqeye-context-engine:latest
    container_name: smartqeye-context-engine
    restart: unless-stopped
    ports:
      - "8765:8765"

  smartqeye-coastal:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - VITE_MAP_TILE_URL=${VITE_MAP_TILE_URL:-}
        - VITE_CONTEXT_API=${VITE_CONTEXT_API:-http://localhost:8765}
    image: smartqeye-coastal:latest
    container_name: smartqeye-coastal-app
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "80:8080"
    volumes:
      - ../SmartQEye_Costal_Videos:/usr/share/nginx/html/videos:ro
      - ../Intrusion_detection:/usr/share/nginx/html/intrusion-media:ro
    environment:
      - NODE_ENV=production

  smartqeye-coastal-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: smartqeye-coastal:dev
    container_name: smartqeye-coastal-dev
    ports:
      - "5174:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
    environment:
      - NODE_ENV=development
    profiles:
      - dev
