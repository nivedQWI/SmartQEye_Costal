# ============================================================
# SmartQEye Coastal — Production Docker Compose
# Security Hardened: Non-root, Resource-limited, Read-only FS
# ============================================================

version: '3.8'

services:
  smartqeye-coastal:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartqeye-coastal:latest
    container_name: smartqeye-coastal-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    # Security Hardening
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    # Resource Limits (Target: 2 Cores, 1GB RAM for edge/central monitoring)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
