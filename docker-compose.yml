services:
  smartqeye-coastal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_MAP_TILE_URL=${VITE_MAP_TILE_URL:-}
    image: smartqeye-coastal:latest
    container_name: smartqeye-coastal-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
